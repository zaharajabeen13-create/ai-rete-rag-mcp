[project]
name = "ai-rete-rag-mcp"
version = "0.7.0"
description = "MCP server for ai·rete·rag — deterministic rule-based decisions with RAG-powered explanations"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ai·rete·rag", email = "contact@ai-rete-rag.com" }]
keywords = ["mcp", "model-context-protocol", "rules-engine", "rete", "rag", "decision-intelligence"]
dependencies = [
    "mcp>=1.2.0,<2",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Only the hosted endpoint needs a web server. A user running the stdio server
# through uvx should not pay for uvicorn on install.
# starlette arrives with mcp today, but remote.py imports it directly — the app,
# the routing and now CORSMiddleware — so it is declared rather than left to a
# transitive edge that mcp is free to change.
remote = ["uvicorn>=0.30", "starlette>=0.37"]

[project.urls]
Homepage = "https://ai-rete-rag.com"
Documentation = "https://ai-rete-rag.com/docs-site"

[project.scripts]
ai-rete-rag-mcp = "ai_rete_rag_mcp.server:main"
ai-rete-rag-mcp-remote = "ai_rete_rag_mcp.remote:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_rete_rag_mcp"]
