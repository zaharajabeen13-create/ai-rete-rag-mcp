[project]
name = "ai-rete-rag-mcp"
version = "0.5.1"
description = "MCP server for ai·rete·rag — deterministic rule-based decisions with RAG-powered explanations"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ai·rete·rag", email = "contact@ai-rete-rag.com" }]
keywords = ["mcp", "model-context-protocol", "rules-engine", "rete", "rag", "decision-intelligence"]
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://ai-rete-rag.com"
Documentation = "https://ai-rete-rag.com/docs-site"

[project.scripts]
ai-rete-rag-mcp = "ai_rete_rag_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_rete_rag_mcp"]
